# Vsapp inversion settings. Velocities: km/s; time: s; rayp: s/km.
# Direct curve:
#   invert_vsapp(model, observed_vsapp=observed, cfg_file='vsapp_inversion.cfg')
# Station mean (uses measured periods and retained-event mean rayp):
#   invert_station_vsapp(model, measurements, cfg_file='vsapp_inversion.cfg')

[data]
periods_s = 0.1, 0.3, 0.5, 0.8, 1.2, 2.0, 3.0
# Blank = equal weights; otherwise one uncertainty or one per period, in km/s.
sigma =

[forward]
rayp = 0.06
f0 = 3.5
method = iter
dt = 0.05
npts = 1024
shift = 10.0
# Optional lower, upper bandpass frequencies in Hz.
pre_filt =
itmax = 400
minderr = 0.001
wlevel = 0.05

[inversion]
# gd: gradient-angle SD; lbfgs: strong Wolfe line search.
optimizer = gd
smooth_sigma_km = 0.5
# Zero only the half-space kernel column; its velocity still participates in smoothing/updates.
zero_halfspace = true
max_iterations = 100
# SD initial persistent step; L-BFGS hard log-update cap.
# At the cap, accept sufficient decrease with negative slope without strong curvature.
max_step_lnvs = 0.05
# L-BFGS only: at most max_backtracks+1 trials per direction.
max_backtracks = 20
gradient_tol = 0.000001
# Stop when |mean_recent - mean_previous|/mean_previous < misfit_tol.
# Each window uses misfit_window accepted updates, excluding iteration zero.
misfit_tol = 0.00000001
misfit_window = 5
lbfgs_memory = 10
wolfe_c1 = 0.0001
wolfe_c2 = 0.9
